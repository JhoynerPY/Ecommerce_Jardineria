spring:
  application:
    name: ecommerce-jardineria
  datasource:
    url: jdbc:mariadb://localhost:3306/ecommerce_jardineria
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

server:
  port: 8080

jwt:
  secret: ecommerceJardineriaSecretKey2024ForJWTSigningWithSufficientLength123456789
  expiration: 86400000

logging:
  level:
    com.uniquindio.ecommerce: DEBUG
    org.springframework.security: DEBUG