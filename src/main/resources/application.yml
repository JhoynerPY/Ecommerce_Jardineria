spring:
  application:
    name: ecommerce-jardineria
  datasource:
    url: "jdbc:h2:mem:testdb;MODE=MariaDB;DB_CLOSE_DELAY=-1"
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: 8080

jwt:
  secret: ecommerceJardineriaSecretKey2024ForJWTSigningWithSufficientLength123456789
  expiration: 86400000

logging:
  level:
    com.uniquindio.ecommerce: DEBUG
    org.springframework.security: DEBUG