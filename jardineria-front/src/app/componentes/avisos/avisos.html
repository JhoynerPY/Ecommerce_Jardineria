<div class="position-fixed top-0 end-0 m-3 d-flex flex-column gap-2" style="z-index: 1060;">
  @if (avisosService.avisos$().length > 0) {
    @for (aviso of avisosService.avisos$(); track aviso.id) {
      <div
        class="alert alert-dismissible shadow fade show"
        role="alert"
        [class]="'alert-' + aviso.tipo"
      >
        <span>{{ aviso.mensaje }}</span>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
          aria-label="Cerrar"
          (click)="avisosService.cerrar(aviso.id)"
        ></button>
      </div>
    }
  }
</div>
